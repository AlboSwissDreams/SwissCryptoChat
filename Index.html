<style>

cing:1.4px;margin:0 0 13px}.contact{display:flex;align-items:center;gap:9px;margin:12px 0}.contact .personav{width:34px;height:34px;border-radius:11px;font-size:12px}.contact .chatname{font-size:12px}.contact button{margin-left:auto;background:transparent;border:0;color:var(--cyan);font-size:18px}.settingrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;margin:12px 0}.toggle{width:34px;height:19px;border-radius:20px;background:#344258;border:0;padding:2px}.toggle:after{content:"";display:block;width:15px;height:15px;background:#fff;border-radius:50%;transition:transform .15s}.toggle.on{background:#248e8a}.toggle.on:after{transform:translateX(15px)}.outlinebtn{width:100%;background:#141e30;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:12px;margin-top:8px}.outlinebtn:hover{border-color:var(--cyan)}.danger{color:#ff9aaf}.empty{margin:auto;text-align:center;max-width:260px;color:var(--muted);padding:30px}.empty .logo{margin:0 auto 15px}.empty h2{color:var(--text);font-size:19px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#162438;border:1px solid #54f6e86b;border-radius:12px;padding:11px 16px;box-shadow:0 10px 40px #0008;font-size:13px;z-index:10}.modalback{position:fixed;inset:0;background:#02040bc9;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(420px,100%);background:#0e1626;border:1px solid #34435b;border-radius:18px;padding:22px;box-shadow:0 25px 80px #0009}.modal h2{font-size:19px;margin:0 0 5px}.modal p{font-size:12px;color:var(--muted);margin:0 0 18px}.modal label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}.modalactions{display:flex;gap:8px;margin-top:18px}.modalactions button{flex:1}.mobiletabs{display:none}

<body><div class="app"><header class="top"><div class="brand"><div class="logo">S</div><div><h1>SwissCryptoChat</h1><small>PRIVATE • CONNECTED</small></div></div><div class="topright"><span class="localpill">● DEMO LOCALE</span><button class="avatar" id="topavatar" title="Cambia foto profilo" aria-label="Cambia foto profilo">A</button></div></header>

<script>
(()=>{'use strict';const KEY='swisscryptochat-v1';const seed=[{id:'mira',name:'Mira Keller',initials:'MK',online:true,unread:2,messages:[{text:'Ehi! Hai visto il nuovo aggiornamento?',mine:false,time:'09:38'},{text:'Sì, l’interfaccia neon è fantastica ⚡',mine:true,time:'09:41'},{text:'Dobbiamo provarla insieme più tardi.',mine:false,time:'09:42'}]},{id:'luca',name:'Luca Moretti',initials:'LM',online:true,unread:0,messages:[{text:'Ti mando i dettagli del progetto.',mine:false,time:'Ieri'},{text:'Perfetto, appena posso li controllo.',mine:true,time:'Ieri'}]},{id:'nora',name:'Nora Weiss',initials:'NW',online:false,unread:1,messages:[{text:'Ciao! Tutto bene?',mine:false,time:'Lun'}]},{id:'system',name:'SwissCrypto Team',initials:'SC',online:true,unread:0,messages:[{text:'Benvenuto su SwissCryptoChat. Questa è una demo locale: puoi esplorare le chat e provare a inviare messaggi.',mine:false,time:'Dom'}]}];let chats,active='mira',filter='all',query='',notifications=true,profilePhoto='';const PHOTO_KEY='swisscryptochat-profile-photo-v1';try{profilePhoto=localStorage.getItem(PHOTO_KEY)||''}catch(e){}const $=id=>document.getElementById(id);function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(d)&&d.length)return d}catch(e){}return structuredClone(seed)}chats=load();function save(){try{localStorage.setItem(KEY,JSON.stringify(chats))}catch(e){toast('Impossibile salvare: memoria browser non disponibile')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function now(){return new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}function current(){return chats.find(c=>c.id===active)}function last(c){return c.messages[c.messages.length-1]}function renderList(){const visible=chats.filter(c=>(c.name+' '+(last(c)?.text||'')).toLowerCase().includes(query.toLowerCase())&&(filter==='all'||c.unread>0));$('chatcount').textContent=String(chats.length).padStart(2,'0');$('chatlist').innerHTML=visible.length?visible.map(c=>`<button class="chatitem ${c.id===active?'active':''}" data-id="${esc(c.id)}"><span class="personav">${esc(c.initials)}${c.online?'<i class="online-dot"></i>':''}</span><span class="chatinfo"><span class="chatline"><span class="chatname">${esc(c.name)}</span><span class="time">${esc(last(c)?.time||'')}</span></span><span class="chatline"><span class="preview">${last(c)?.mine?'Tu: ':''}${esc(last(c)?.text||'Nessun messaggio')}</span>${c.unread?`<span class="unread">${c.unread}</span>`:''}</span></span></button>`).join(''):'<div class="empty">Nessuna chat trovata.<br>Prova un’altra ricerca o crea una nuova chat.</div>';document.querySelectorAll('.chatitem').forEach(b=>b.onclick=()=>selectChat(b.dataset.id))}function renderHead(){const c=current();if(!c){$('chathead').innerHTML='';return}$('chathead').innerHTML=`<button class="iconbtn backbtn" id="backbtn" aria-label="Torna alle chat">‹</button><span class="personav">${esc(c.initials)}${c.online?'<i class="online-dot"></i>':''}</span><div><div class="chatname">${esc(c.name)}</div><div class="chatstatus">${c.online?'● Online · demo':'Offline · demo'}</div></div><div class="headactions"><button class="iconbtn optional" id="contactinfo" title="Informazioni contatto">ⓘ</button><button class="iconbtn" id="clearsearch" title="Cerca nelle chat">⌕</button><button class="iconbtn danger" id="deletechat" title="Elimina conversazione" aria-label="Elimina conversazione">🗑</button></div>`;$('backbtn').onclick=()=>mobileMode('list');$('contactinfo').onclick=()=>toast('Contatto demo: nessun account reale collegato.');$('clearsearch').onclick=()=>{$('search').focus();toast('Cerca tra nomi e messaggi dall’elenco chat.')};$('deletechat').onclick=deleteCurrentChat}function renderMessages(){const c=current();if(!c){$('messages').innerHTML='<div class="empty"><div class="logo">S</div><h2>Benvenuto su SwissCryptoChat</h2><p>Scegli una chat oppure crea una nuova conversazione.</p></div>';return}$('messages').innerHTML='<div class="daylabel">CONVERSAZIONE DEMO</div>'+c.messages.map(m=>`<div class="msg ${m.mine?'mine':''}"><div class="bubble">${esc(m.text)}</div><div class="msgmeta">${esc(m.time)} ${m.mine?'<span class="read">✓✓</span>':''}</div></div>`).join('');$('messages').scrollTop=$('messages').scrollHeight;$('messageinput').placeholder='Scrivi a '+c.name+'…';$('sendbtn').disabled=false}function renderContacts(){const others=chats.filter(c=>c.id!==active).slice(0,5);$('contacts').innerHTML=others.map(c=>`<div class="contact"><span class="personav">${esc(c.initials)}${c.online?'<i class="online-dot"></i>':''}</span><span><span class="chatname">${esc(c.name)}</span><br><span class="muted">${c.online?'Online':'Offline'}</span></span><button data-open="${esc(c.id)}" aria-label="Apri chat con ${esc(c.name)}">›</button></div>`).join('')||'<div class="muted">Aggiungi il tuo primo contatto.</div>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>selectChat(b.dataset.open))}function render(){renderList();renderHead();renderMessages();renderContacts();save()}function selectChat(id){active=id;const c=current();if(c)c.unread=0;render();mobileMode('chat')}function mobileMode(mode){const l=$('layout');l.classList.toggle('show-list',mode==='list');l.classList.toggle('show-chat',mode==='chat');$('tabchats').classList.toggle('active',mode==='list');$('tabconversation').classList.toggle('active',mode==='chat');$('tabprofile').classList.toggle('active',mode==='profile');if(mode==='profile'){document.querySelector('.right').style.display='block';document.querySelector('.right').style.position='fixed';document.querySelector('.right').style.inset='72px 8px 62px';document.querySelector('.right').style.zIndex='5';document.querySelector('.right').style.overflow='auto'}else{document.querySelector('.right').style.display='';document.querySelector('.right').style.position='';document.querySelector('.right').style.inset='';document.querySelector('.right').style.zIndex='';document.querySelector('.right').style.overflow=''}}function toast(msg){$('toastroot').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('toastroot').innerHTML='',2600)}function modal(title,desc,fields,submitLabel,callback){$('overlay').innerHTML=`<div class="modalback"><form class="modal" id="modalform"><h2>${esc(title)}</h2><p>${esc(desc)}</p>${fields.map(f=>`<label for="${f.id}">${esc(f.label)}</label><input class="field" id="${f.id}" name="${f.id}" placeholder="${esc(f.placeholder)}" ${f.required?'required':''} maxlength="${f.max||80}">`).join('')}<div class="modalactions"><button type="button" class="outlinebtn" id="cancelmodal">Annulla</button><button type="submit" class="send">${esc(submitLabel)}</button></div></form></div>`;$('cancelmodal').onclick=()=>$('overlay').innerHTML='';$('modalform').onsubmit=e=>{e.preventDefault();const data={};fields.forEach(f=>data[f.id]=$(f.id).value.trim());if(fields.some(f=>f.required&&!data[f.id]))return;$('overlay').innerHTML='';callback(data)}}function deleteCurrentChat(){const c=current();if(!c)return;modal('Eliminare questa chat?','La conversazione e i suoi messaggi verranno rimossi da questo browser. Questa azione non può essere annullata.',[],'Elimina chat',()=>{chats=chats.filter(x=>x.id!==active);active=chats[0]?.id||null;render();mobileMode('list');toast('Chat eliminata da questo dispositivo.')})}function updateProfilePhoto(){const els=[$('topavatar'),$('bigav')];els.forEach(el=>{if(!el)return;if(profilePhoto){el.innerHTML='<img alt="Foto profilo" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" src="'+profilePhoto+'">'}else{el.textContent='A'}})}function addNew(){modal('Nuova conversazione','Crea un contatto demo per iniziare una chat.',[{id:'name',label:'Nome contatto',placeholder:'Es. Alex Rossi',required:true},{id:'firstmsg',label:'Primo messaggio (facoltativo)',placeholder:'Ciao!'}],'Crea chat',d=>{const name=d.name.slice(0,50);const id='c'+Date.now();const initials=name.split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();chats.unshift({id,name,initials,online:false,unread:0,messages:d.firstmsg?[{text:d.firstmsg,mine:true,time:now()}]:[]});active=id;render();mobileMode('chat');toast('Conversazione creata sul dispositivo.')})}function sendMessage(e){e.preventDefault();const input=$('messageinput'),text=input.value.trim(),c=current();if(!text||!c)return;c.messages.push({text:text.slice(0,4000),mine:true,time:now()});input.value='';input.style.height='auto';renderMessages();renderList();renderContacts();save();if(notifications)toast('Messaggio aggiunto alla demo locale.')}$('composeform').addEventListener('submit',sendMessage);$('messageinput').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'});$('messageinput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composeform').requestSubmit()}});$('search').addEventListener('input',e=>{query=e.target.value;renderList()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));renderList()});$('newchat').onclick=addNew;$('changeavatar').onclick=()=>$('avatarfile').click();$('topavatar').onclick=()=>$('avatarfile').click();$('avatarfile').onchange=()=>{const file=$('avatarfile').files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Scegli un file immagine.');return}if(file.size>2*1024*1024){toast('Scegli una foto più piccola di 2 MB.');$('avatarfile').value='';return}const reader=new FileReader();reader.onload=()=>{profilePhoto=String(reader.result||'');try{localStorage.setItem(PHOTO_KEY,profilePhoto);updateProfilePhoto();toast('Foto profilo salvata in questo browser.')}catch(e){profilePhoto='';toast('Impossibile salvare la foto: prova un’immagine più piccola.')}};reader.readAsDataURL(file)};$('removeavatar').onclick=()=>{profi
